# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "fb959e692364c4077d75bd1908f8c38f"
name = "Combined Discount"
application_url = "https://combined-discount-shopify.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Maintains each customer's $app:combined-discount-state metafield, which the
  # combined-discount Function reads to enforce the "purchased before <date>"
  # gate and the per-customer order cap. Functions are pure, so they cannot
  # look up order history themselves.
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions,write_discounts,write_customers,read_orders"

[auth]
redirect_urls = [
  "https://combined-discount-shopify.fly.dev/auth/callback",
  "https://combined-discount-shopify.fly.dev/auth/shopify/callback",
  "https://combined-discount-shopify.fly.dev/api/auth",
  "https://combined-discount-shopify.fly.dev/api/auth/callback"
]

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

# Read model the discount Function consumes: first purchase date, per-campaign
# qualifying purchase date, and per-campaign redemption count.
[customer.metafields.app.combined-discount-state]
type = "json"
name = "Combined Discount customer state"
description = "Purchase history and redemption counters used by the combined-discount function"

  [customer.metafields.app.combined-discount-state.access]
  admin = "merchant_read"
  storefront = "none"

[discount.metafields.app.function-configuration]
type = "json"
name = "Combined Discount configuration"
description = "Stores amountOff for the combined discount function"

  [discount.metafields.app.function-configuration.access]
  admin = "merchant_read_write"
  storefront = "none"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"
