# /etc/nginx/sites-available/discount.treelogy-services.my.id
#
# Terminates TLS and forwards everything to the live blue/green slot (127.0.0.1:3200 or :3201).
#
# Self-contained like the api.* vhost: it does not include certbot's
# options-ssl-nginx.conf / ssl-dhparams.pem, because certbot on this server
# issues certificates but fails to install them, so those files may not exist.
#
# No X-Frame-Options / frame-ancestors here: this is an embedded app rendered
# inside the Shopify admin iframe, and the app itself sets the per-shop
# Content-Security-Policy frame-ancestors header. Overriding it here would
# blank the app in the admin.

# `upstream combined_discount` lives in /etc/nginx/conf.d/combined-discount-upstream.conf,
# which the deploy script rewrites to point at the live blue/green slot.

server {
    listen 80;
    server_name discount.treelogy-services.my.id;

    # Let certbot renew over HTTP-01 without being redirected.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name discount.treelogy-services.my.id;

    ssl_certificate     /etc/letsencrypt/live/discount.treelogy-services.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/discount.treelogy-services.my.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/combined-discount.access.log;
    error_log  /var/log/nginx/combined-discount.error.log warn;

    # Webhook payloads and admin form posts are small.
    client_max_body_size 2m;
    proxy_read_timeout   60s;
    proxy_send_timeout   60s;

    # The probe touches the database; keep it off the public internet.
    location = /healthz { return 404; }

    # Fingerprinted build assets never change under the same name.
    location /assets/ {
        proxy_pass         http://combined_discount;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Connection "";
        expires            1y;
        add_header         Cache-Control "public, immutable" always;
    }

    location / {
        proxy_pass         http://combined_discount;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }
}
