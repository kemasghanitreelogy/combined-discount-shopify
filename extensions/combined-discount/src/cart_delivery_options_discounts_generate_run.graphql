query Input {
  cart {
    utmAttribute: attribute(key: "utm_campaign") {
      value
    }
    buyerIdentity {
      customer {
        id
        state: metafield(namespace: "$app", key: "combined-discount-state") {
          jsonValue
        }
      }
    }
    deliveryGroups {
      deliveryOptions {
        handle
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") {
      jsonValue
    }
  }
}
